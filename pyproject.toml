[project]
name = "yaspotsurfer"
version = "0.1.0"
description = "Migration tool from Yandex Music to Spotify"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "yandex-music==3.0.0",
]

[project.scripts]
yandex-spike = "yandex_spike.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_spike"]
